<script>
/**
 * Budget Allocations module.
 *
 * Money is split across two scopes joined by the Owner Pay bridge:
 *   Business — GST, Business Tax, Business ACC, Reserve. Stays in the
 *              business account.
 *   Owner Pay — the remainder, drawn from business to personal.
 *   Personal — Personal Tax, Personal ACC, Donate, Save, Invest, Spend.
 *
 * Category definitions, ordering and the whole cascade come from the server
 * registry (BudgetCategories.gs) via AppCache.budgetCategories. This file
 * keeps no list of its own and does no allocation maths — the preview is
 * computed by the same server code that writes the allocations.
 *
 * Stored status model: allocated -> paid. The button wording varies by how
 * the money actually moves (paid out / set aside / transferred).
 */

function renderBudgetPage(container) {
  container.innerHTML =
    '<div class="tab-bar" id="budget-tabs">' +
      '<button type="button" class="active" onclick="showBudgetTab(\'summary\')">Money Flow</button>' +
      '<button type="button" onclick="showBudgetTab(\'allocate\')">Allocate Invoice</button>' +
    '</div>' +
    '<div id="budget-tab-content"></div>';

  showBudgetTab('summary');
}

function showBudgetTab(tab) {
  var btns = document.querySelectorAll('#budget-tabs button');
  btns.forEach(function(btn, i) {
    btn.classList.toggle('active', (tab === 'summary' && i === 0) || (tab === 'allocate' && i === 1));
  });

  if (tab === 'summary') {
    renderBudgetSummary();
  } else {
    renderBudgetAllocate();
  }
}

// --- Budget Summary ---

function renderBudgetSummary() {
  var content = document.getElementById('budget-tab-content');

  var existingFrom = document.getElementById('budget-filter-from');
  var existingTo = document.getElementById('budget-filter-to');
  if (existingFrom && existingTo) {
    AppState.dateFrom = existingFrom.value;
    AppState.dateTo = existingTo.value;
  } else {
    var range = datePreset('6months');
    AppState.dateFrom = range.from;
    AppState.dateTo = range.to;
  }

  content.innerHTML =
    '<div class="filters">' +
      buildDateFilters('budget-filter-from', 'budget-filter-to', AppState.dateFrom, AppState.dateTo) +
      '<button type="button" class="btn-subtle" onclick="renderBudgetSummary()">Apply</button>' +
    '</div>' +
    '<p class="muted small" style="margin:-0.5rem 0 0.5rem;">Default: last 6 months</p>' +
    '<div id="budget-summary-body" aria-busy="true">Loading...</div>';

  serverCall('getBudgetSummary', { dateFrom: AppState.dateFrom, dateTo: AppState.dateTo }).then(function(summary) {
    var body = document.getElementById('budget-summary-body');
    var scopes = (summary && summary.scopes) || [];
    var totals = (summary && summary.totals) || {};
    var holdings = (summary && summary.accountHoldings) || {};
    var bridge = (summary && summary.bridge) || { allocated: 0, paid: 0, outstanding: 0 };

    if (!scopes.length) {
      body.innerHTML =
        '<article class="empty-state">' +
          '<h3>No allocations in this date range</h3>' +
          '<p>Mark an invoice as paid, then come here to allocate it.</p>' +
        '</article>';
      return;
    }

    var html = '';

    // --- Overview tiles ---
    html += '<section class="flow-group">' +
      '<h3 class="flow-group__title">Overview</h3>' +
      '<div class="flow-overview">' +
        '<div class="flow-tile flow-tile--total">' +
          '<span class="flow-tile__label">Total allocated</span>' +
          '<span class="flow-tile__value">' + formatCurrency(totals.allocated) + '</span>' +
          '<span class="flow-tile__detail">across ' + (totals.allocationCount || 0) + ' allocations</span>' +
        '</div>' +
        '<div class="flow-tile flow-tile--paid">' +
          '<span class="flow-tile__label">Moved / paid</span>' +
          '<span class="flow-tile__value">' + formatCurrency(totals.paid) + '</span>' +
          '<span class="flow-tile__detail">' + pctOf(totals.paid, totals.allocated) + ' of total</span>' +
        '</div>' +
        '<div class="flow-tile flow-tile--outstanding">' +
          '<span class="flow-tile__label">Still to move</span>' +
          '<span class="flow-tile__value">' + formatCurrency(totals.outstanding) + '</span>' +
          '<span class="flow-tile__detail">' + pctOf(totals.outstanding, totals.allocated) + ' of total</span>' +
        '</div>' +
      '</div>' +
      '<p class="muted small" style="margin:0.35rem 0 0;">Owner Pay is excluded from these totals — ' +
        'it moves money between your own accounts rather than adding to it.</p>' +
    '</section>';

    // --- Business / personal split at a glance ---
    html += '<section class="flow-group">' +
      '<h3 class="flow-group__title">Business vs personal</h3>' +
      '<div class="flow-grid">' +
        tilePlain('Business — still to action', holdings.business,
          'GST, tax, ACC and reserve not yet actioned') +
        tilePlain('Drawn to personal (Owner Pay)', bridge.paid,
          formatCurrency(bridge.outstanding) + ' still to draw') +
        tilePlain('Personal — still to action', holdings.personal,
          'personal allocations not yet actioned') +
      '</div>' +
      '<p class="muted small" style="margin:0.35rem 0 0;">' +
        'Business figures are money the company owes or is holding back, so they should still be ' +
        'sitting in the business account.' +
        (holdings.legacy
          ? ' A further ' + formatCurrency(holdings.legacy) + ' is outstanding against pre-company (sole trader) allocations.'
          : '') +
      '</p>' +
    '</section>';

    // --- Per-scope tiles ---
    scopes.forEach(function(group) {
      if (group.scope === 'bridge') return; // covered by the tile above
      html += '<section class="flow-group">' +
        '<h3 class="flow-group__title">' + escapeHtml(group.label) +
          ' <span class="muted small">' + formatCurrency(group.outstanding) + ' outstanding of ' +
          formatCurrency(group.allocated) + '</span></h3>' +
        '<div class="flow-grid">' +
          group.categories.map(function(cat) {
            return cat.isWithheld
              ? tileWithheldPaid(cat.category + ' (at source)', cat.paid)
              : tileSplit(cat.category, cat.allocated, cat.paid, cat.outstanding);
          }).join('') +
        '</div>' +
      '</section>';
    });

    // --- Per-category detail, grouped by scope ---
    html += '<section class="flow-group">' +
      '<h3 class="flow-group__title">By category</h3>';

    scopes.forEach(function(group) {
      html += '<h4 class="muted" style="margin:0.75rem 0 0.35rem;">' + escapeHtml(group.label) + '</h4>' +
        '<div class="category-list">' +
        group.categories.map(renderCategoryBlock).join('') +
        '</div>';
    });

    html += '</section>';

    body.innerHTML = html;
  }).catch(function(err) {
    var body = document.getElementById('budget-summary-body');
    if (body) body.innerHTML = '<p class="error">Error: ' + escapeHtml(err.message) + '</p>';
  });
}

function pctOf(part, total) {
  if (!total || total === 0) return '0%';
  return ((Number(part) / Number(total)) * 100).toFixed(0) + '%';
}

function tilePlain(label, amount, detail) {
  return '<div class="mini-tile">' +
    '<span class="mini-tile__label">' + escapeHtml(label) + '</span>' +
    '<span class="mini-tile__value">' + formatCurrency(amount || 0) + '</span>' +
    '<span class="mini-tile__detail">' + escapeHtml(detail || '') + '</span>' +
  '</div>';
}

function tileWithheldPaid(label, amount) {
  return '<div class="mini-tile mini-tile--withheld">' +
    '<span class="mini-tile__label">' + escapeHtml(label) + '</span>' +
    '<span class="mini-tile__value">' + formatCurrency(amount || 0) + '</span>' +
    '<span class="mini-tile__detail">auto-paid</span>' +
  '</div>';
}

function tileSplit(label, allocated, paid, outstanding) {
  return '<div class="mini-tile mini-tile--split">' +
    '<span class="mini-tile__label">' + escapeHtml(label) + '</span>' +
    '<span class="mini-tile__value">' + formatCurrency(outstanding || 0) + '</span>' +
    '<span class="mini-tile__detail">outstanding</span>' +
    '<div class="mini-tile__bar">' +
      '<div class="mini-tile__bar-paid" style="width:' + pctOf(paid, allocated) + '"></div>' +
    '</div>' +
    '<div class="mini-tile__split">' +
      '<span>Paid ' + formatCurrency(paid || 0) + '</span>' +
      '<span>of ' + formatCurrency(allocated || 0) + '</span>' +
    '</div>' +
  '</div>';
}

function renderCategoryBlock(cat) {
  var isWithheld = cat.isWithheld;
  var barPct = pctOf(cat.paid, cat.allocated);
  var actionLabel = settleActionLabel(cat.settle);
  var movedWord = cat.settle === 'hold' ? 'set aside' : 'moved';

  var html = '<article class="category-block">' +
    '<header class="category-block__header">' +
      '<div>' +
        '<h4>' + escapeHtml(cat.category) + (isWithheld ? ' <span class="tag tag--auto">auto-paid</span>' : '') + '</h4>' +
        '<p class="muted">' + formatCurrency(cat.paid) + ' ' + movedWord +
          (!isWithheld ? ' · <strong>' + formatCurrency(cat.outstanding) + ' outstanding</strong>' : '') +
          ' · ' + formatCurrency(cat.allocated) + ' total' +
        '</p>' +
      '</div>' +
      '<div class="category-block__total">' + formatCurrency(cat.allocated) + '</div>' +
    '</header>' +
    '<div class="progress-bar"><div class="progress-bar__fill" style="width:' + barPct + '"></div></div>' +
    '<table class="data-table data-table--compact">' +
      '<thead><tr>' +
        '<th>Invoice</th><th>Source</th><th class="number">Amount</th>' +
        '<th>Status</th><th>Moved on</th><th>Note</th><th></th>' +
      '</tr></thead><tbody>';

  cat.items.sort(function(a, b) {
    var sa = String(a.invoice_id), sb = String(b.invoice_id);
    var ma = sa.match(/^(\d+)(.*)$/), mb = sb.match(/^(\d+)(.*)$/);
    if (ma && mb) {
      var na = parseInt(ma[1], 10), nb = parseInt(mb[1], 10);
      if (na !== nb) return na - nb;
      return ma[2].localeCompare(mb[2]);
    }
    return sa.localeCompare(sb);
  });

  cat.items.forEach(function(item) {
    var status = item.status || 'allocated';
    html += '<tr>' +
      '<td><code>' + escapeHtml(item.invoice_id) + '</code></td>' +
      '<td>' + escapeHtml(item.business_name) + '</td>' +
      '<td class="number">' + formatCurrency(item.amount) + '</td>' +
      '<td><span class="badge badge-' + status + '">' + status + '</span></td>' +
      '<td>' + (item.transfer_date ? formatDate(item.transfer_date) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (item.notes ? escapeHtml(item.notes) : '<span class="muted">—</span>') + '</td>' +
      '<td class="actions">';

    if (!isWithheld) {
      if (status === 'allocated') {
        html += '<button type="button" class="btn-small btn-primary" onclick="markAllocationPaid(\'' + item.allocation_id + '\')">' +
          escapeHtml(actionLabel) + '</button>';
      } else if (status === 'paid') {
        html += '<button type="button" class="btn-small btn-subtle" onclick="markAllocationUnpaid(\'' + item.allocation_id + '\')">Undo</button>';
      }
    }

    html += '</td></tr>';
  });
  html += '</tbody></table></article>';
  return html;
}

function markAllocationPaid(allocationId) {
  var note = prompt('Where did this go? (optional)');
  if (note === null) return;
  var params = allocationId + '|paid|' + todayStr() + '|' + (note || '');
  serverCall('updateAllocationStatusFromClient', params).then(function() {
    showToast('Marked as paid');
    renderBudgetSummary();
  }).catch(function(err) { showToast(err.message, 'error'); });
}

function markAllocationUnpaid(allocationId) {
  serverCall('updateAllocationStatusFromClient', allocationId + '|allocated|').then(function() {
    showToast('Reverted to allocated');
    renderBudgetSummary();
  }).catch(function(err) { showToast(err.message, 'error'); });
}

// --- Allocate Invoice ---

function renderBudgetAllocate() {
  var content = document.getElementById('budget-tab-content');
  content.innerHTML = '<div aria-busy="true">Loading invoices...</div>';

  Promise.all([
    serverCall('getInvoicesWithDetails', { dateFrom: AppState.dateFrom, dateTo: AppState.dateTo }),
    serverCall('getAllClient', 'BudgetAllocations')
  ]).then(function(results) {
    var invoices = results[0] || [];
    var existingAllocs = results[1] || [];
    var rules = AppCache.budgetRules || [];

    var allocatedInvoiceIds = {};
    existingAllocs.forEach(function(a) { allocatedInvoiceIds[a.invoice_id] = true; });

    // Only paid invoices, not yet allocated
    var eligible = invoices.filter(function(inv) {
      return inv.status === 'paid' && !allocatedInvoiceIds[inv.invoice_id];
    });

    if (eligible.length === 0) {
      content.innerHTML =
        '<article class="empty-state">' +
          '<h3>Nothing to allocate</h3>' +
          '<p class="muted">Every paid invoice is already allocated. Mark a new invoice as paid in the Invoices tab to allocate it here.</p>' +
        '</article>';
      return;
    }

    if (rules.length === 0) {
      content.innerHTML =
        '<article class="empty-state">' +
          '<h3>No budget rules yet</h3>' +
          '<p class="muted">Add a budget rule under Settings → Budget Rules before allocating.</p>' +
        '</article>';
      return;
    }

    var defaultRule = rules.find(function(r) {
      return r.is_default === true || r.is_default === 'TRUE' || r.is_default === 'true';
    }) || rules[0];

    var invoiceOptions = eligible.map(function(inv) {
      return {
        id: inv.invoice_id,
        label: inv.invoice_id + ' — ' + inv.business_name + ' (' + formatCurrency(inv.total, inv.currency) + ')'
      };
    });

    // Flag pre-company rules so an old cascade is never applied by accident.
    var ruleOptions = rules.map(function(r) {
      return {
        id: r.rule_id,
        label: r.name + (r.model === 'company' ? '' : ' (sole trader)')
      };
    });

    var html =
      '<form id="allocate-form" class="form-card">' +
        '<div class="form-row">' +
          '<label>Invoice ' + buildSelect('ba-invoice', invoiceOptions, 'id', 'label', { required: true }) + '</label>' +
          '<label>Budget rule ' + buildSelect('ba-rule', ruleOptions, 'id', 'label', { required: true, selected: defaultRule.rule_id, placeholder: false }) + '</label>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button type="button" onclick="previewAllocation()">Preview allocation</button>' +
        '</div>' +
      '</form>' +
      '<div id="allocation-preview"></div>';

    content.innerHTML = html;
  }).catch(function(err) {
    content.innerHTML = '<p class="error">Error: ' + escapeHtml(err.message) + '</p>';
  });
}

/**
 * Cascade rows for the preview, built from the stage figures the server
 * returned. Company and sole-trader rules report different stages.
 */
function cascadeRows(model, s, currency) {
  var rows = [];
  var add = function(label, value, opts) {
    opts = opts || {};
    if (opts.onlyIfNonZero && !value) return;
    rows.push({ label: label, value: value, negative: !!opts.negative, strong: !!opts.strong });
  };

  add('Gross (billed hours)', s.gross);
  add('Less withheld at source', s.withheld, { negative: true, onlyIfNonZero: true });

  if (model === 'company') {
    add('Business income', s.businessIncome, { strong: true });
    add('Less business allocations (tax, ACC, reserve)', s.businessObligations, { negative: true, onlyIfNonZero: true });
    add('Owner Pay — drawn to personal', s.ownerPay, { strong: true });
    add('Less personal tax & ACC', s.personalObligations, { negative: true, onlyIfNonZero: true });
    add('Personal net to distribute', s.personalNet, { strong: true });
  } else {
    add('Adjusted', s.adjusted, { strong: true });
    add('Less obligations (tax/ACC to pay)', s.obligations, { negative: true, onlyIfNonZero: true });
    add('Net to distribute', s.net, { strong: true });
  }

  add('Plus GST collected (held for IRD)', s.gst, { onlyIfNonZero: true });

  return rows.map(function(r) {
    return '<div' + (r.strong ? ' class="preview-numbers__key"' : '') + '>' +
      '<span class="muted">' + escapeHtml(r.label) + '</span>' +
      '<strong>' + (r.negative ? '&minus;' : '') + formatCurrency(r.value, currency) + '</strong>' +
    '</div>';
  }).join('');
}

function previewAllocation() {
  var invoiceId = document.getElementById('ba-invoice').value;
  var ruleId = document.getElementById('ba-rule').value;

  if (!invoiceId || !ruleId) {
    showToast('Pick an invoice and a rule.', 'error');
    return;
  }

  var preview = document.getElementById('allocation-preview');
  preview.innerHTML = '<div aria-busy="true">Calculating...</div>';

  // The server computes this with the same code that writes the allocations,
  // so a preview can never disagree with the result.
  serverCall('previewAllocationFromClient', invoiceId + '|' + ruleId).then(function(data) {
    var currency = data.currency || 'NZD';
    var lines = data.lines || [];
    var isCompany = data.model === 'company';

    var explainer = isCompany
      ? 'Budget is allocated from billed hours only (expenses are pass-throughs). ' +
        'Business tax, ACC and reserve come off business income; what is left is Owner Pay, ' +
        'drawn to your personal account. Personal tax and ACC come off Owner Pay, and ' +
        'Donate/Save/Invest/Spend split what remains. GST is held for the IRD and sits outside the split.'
      : 'Pre-company rule: withheld comes off gross to give adjusted, tax/ACC to pay come off ' +
        'adjusted to give net, and Donate/Save/Invest/Spend split the net.';

    var html =
      '<article class="preview-card">' +
        '<header>' +
          '<h3>Preview</h3>' +
          '<p class="muted">' + escapeHtml(data.invoice_id) + ' · ' + escapeHtml(data.business_name || '') +
            ' · Rule: <strong>' + escapeHtml(data.rule.name) + '</strong>' +
            (isCompany ? '' : ' <span class="tag">sole trader</span>') + '</p>' +
        '</header>' +
        '<div class="preview-numbers">' + cascadeRows(data.model, data.stages || {}, currency) + '</div>' +
        '<p class="muted" style="font-size:0.78rem;margin:0 0 0.5rem;">' + explainer + '</p>' +
        '<table class="data-table">' +
          '<thead><tr><th>Category</th><th class="number">%</th><th class="number">Amount</th><th>Note</th></tr></thead><tbody>';

    var basisNote = {
      gross: 'From gross',
      invoice_gst: 'From invoice GST',
      business_income: 'From business income',
      remainder: 'Remainder — business income less business allocations',
      owner_pay: 'From Owner Pay',
      personal_net: 'From personal net',
      adjusted: 'From adjusted',
      net: 'From net'
    };

    var lastScope = null;
    lines.forEach(function(line) {
      if (line.scope !== lastScope) {
        lastScope = line.scope;
        html += '<tr class="group-row"><td colspan="4"><strong>' + escapeHtml(scopeLabel(line.scope)) + '</strong></td></tr>';
      }
      html += '<tr>' +
        '<td>' + escapeHtml(line.label) +
          (line.settle === 'auto_paid' ? ' <span class="tag tag--auto">auto-paid</span>' : '') +
          (line.isTransfer ? ' <span class="tag">transfer</span>' : '') + '</td>' +
        '<td class="number">' + (line.pct == null ? '—' : formatPercent(line.pct)) + '</td>' +
        '<td class="number">' + formatCurrency(line.amount, currency) + '</td>' +
        '<td class="muted">' + escapeHtml(basisNote[line.basis] || '') + '</td>' +
      '</tr>';
    });

    html += '<tr class="total-row"><td><strong>Total (excl. Owner Pay transfer)</strong></td><td></td>' +
      '<td class="number"><strong>' + formatCurrency(data.total, currency) + '</strong></td>' +
      '<td class="muted">equals the invoice total</td></tr>';
    html += '</tbody></table>' +
      '<div class="form-actions">' +
        '<button type="button" class="btn-primary" onclick="confirmAllocation()">Confirm allocation</button>' +
        '<button type="button" class="btn-subtle" onclick="document.getElementById(\'allocation-preview\').innerHTML=\'\'">Cancel</button>' +
      '</div>' +
    '</article>';

    preview.innerHTML = html;
  }).catch(function(err) {
    preview.innerHTML = '<p class="error">Error: ' + escapeHtml(err.message) + '</p>';
  });
}

function scopeLabel(scope) {
  var reg = AppCache.budgetCategories;
  var scopes = (reg && reg.scopes) || [];
  var found = scopes.find(function(s) { return s.scope === scope; });
  return found ? found.label : scope;
}

function confirmAllocation() {
  var invoiceId = document.getElementById('ba-invoice').value;
  var ruleId = document.getElementById('ba-rule').value;

  serverCall('allocateBudgetFromClient', invoiceId + '|' + ruleId).then(function() {
    showToast('Budget allocated');
    App.invalidate(['budget', 'dashboard']);
    showBudgetTab('summary');
  }).catch(function(err) {
    showToast(err.message, 'error');
  });
}
</script>
