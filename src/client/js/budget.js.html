<script>
/**
 * Budget Allocations module.
 *
 * Money sits in two pots joined by the Owner Pay bridge:
 *   Business — GST, Business Tax, Business ACC, Reserve. Stays in the
 *              business account.
 *   Owner Pay — the remainder, drawn from business to personal.
 *   Personal — Personal Tax, Personal ACC, Donate, Save, Invest, Spend.
 *
 * The Money Flow tab answers two questions and nothing else: how much should
 * still be sitting in each pot, and what needs actioning. Each pot breaks its
 * buckets down by how the money leaves (owed out / held back / to transfer),
 * and every outstanding allocation across both pots appears in one action list.
 *
 * Category definitions, ordering, settle wording and the whole cascade come
 * from the server registry (BudgetCategories.gs) via AppCache.budgetCategories.
 * This file keeps no list of its own and does no allocation maths — the preview
 * is computed by the same server code that writes the allocations.
 *
 * Stored status model: allocated -> paid.
 */

function renderBudgetPage(container) {
  container.innerHTML =
    '<div class="tab-bar" id="budget-tabs">' +
      '<button type="button" class="active" onclick="showBudgetTab(\'summary\')">Money Flow</button>' +
      '<button type="button" onclick="showBudgetTab(\'allocate\')">Allocate Invoice</button>' +
    '</div>' +
    '<div id="budget-tab-content"></div>';

  showBudgetTab('summary');
}

function showBudgetTab(tab) {
  var btns = document.querySelectorAll('#budget-tabs button');
  btns.forEach(function(btn, i) {
    btn.classList.toggle('active', (tab === 'summary' && i === 0) || (tab === 'allocate' && i === 1));
  });

  if (tab === 'summary') {
    renderBudgetSummary();
  } else {
    renderBudgetAllocate();
  }
}

// --- Money Flow ---

function renderBudgetSummary() {
  var content = document.getElementById('budget-tab-content');

  var existingFrom = document.getElementById('budget-filter-from');
  var existingTo = document.getElementById('budget-filter-to');
  if (existingFrom && existingTo) {
    AppState.dateFrom = existingFrom.value;
    AppState.dateTo = existingTo.value;
  } else {
    var range = datePreset('6months');
    AppState.dateFrom = range.from;
    AppState.dateTo = range.to;
  }

  content.innerHTML =
    '<div class="filters">' +
      buildDateFilters('budget-filter-from', 'budget-filter-to', AppState.dateFrom, AppState.dateTo) +
      '<button type="button" class="btn-subtle" onclick="renderBudgetSummary()">Apply</button>' +
    '</div>' +
    '<p class="muted small" style="margin:-0.5rem 0 0.5rem;">Default: last 6 months</p>' +
    '<div id="budget-summary-body" aria-busy="true">Loading...</div>';

  serverCall('getBudgetSummary', { dateFrom: AppState.dateFrom, dateTo: AppState.dateTo }).then(function(summary) {
    var body = document.getElementById('budget-summary-body');
    if (!body) return;

    var scopes = (summary && summary.scopes) || [];
    if (!scopes.length) {
      body.innerHTML =
        '<article class="empty-state">' +
          '<h3>No allocations in this date range</h3>' +
          '<p>Mark an invoice as paid, then come here to allocate it.</p>' +
        '</article>';
      return;
    }

    body.innerHTML =
      renderFlowStrip(summary) +
      renderPots(summary) +
      renderActionList(summary) +
      renderActionedList(summary) +
      renderLegacySection(summary);
  }).catch(function(err) {
    var body = document.getElementById('budget-summary-body');
    if (body) body.innerHTML = '<p class="error">Error: ' + escapeHtml(err.message) + '</p>';
  });
}

function scopeOf(summary, scope) {
  return ((summary && summary.scopes) || []).find(function(s) { return s.scope === scope; }) || null;
}

/**
 * Income -> business pot -> Owner Pay -> personal pot, on one line.
 */
function renderFlowStrip(summary) {
  var totals = summary.totals || {};
  var holdings = summary.accountHoldings || {};
  var bridge = summary.bridge || { allocated: 0, paid: 0, outstanding: 0 };

  function step(label, value, detail) {
    return '<div class="flow-step">' +
      '<span class="flow-step__label">' + escapeHtml(label) + '</span>' +
      '<span class="flow-step__value">' + formatCurrency(value || 0) + '</span>' +
      '<span class="flow-step__detail">' + escapeHtml(detail) + '</span>' +
    '</div>';
  }

  return '<section class="flow-group">' +
    '<div class="flow-strip">' +
      step('Allocated income', totals.allocated,
        (totals.allocationCount || 0) + ' allocations') +
      '<span class="flow-strip__arrow" aria-hidden="true">&rarr;</span>' +
      step('Business pot', holdings.business, 'still to action') +
      '<span class="flow-strip__arrow" aria-hidden="true">&rarr;</span>' +
      step('Owner Pay drawn', bridge.paid,
        formatCurrency(bridge.outstanding) + ' still to draw') +
      '<span class="flow-strip__arrow" aria-hidden="true">&rarr;</span>' +
      step('Personal pot', holdings.personal, 'still to action') +
    '</div>' +
    '<p class="muted small" style="margin:0.4rem 0 0;">' +
      'Owner Pay is a transfer between your own accounts, so it is not counted in allocated income.' +
    '</p>' +
  '</section>';
}

/**
 * One card per pot. Buckets grouped by how the money leaves, with a subtotal
 * per group — that grouping is what makes "what is owed where" readable.
 */
function renderPots(summary) {
  var holdings = summary.accountHoldings || {};
  var html = '<div class="pot-grid">';

  ['business', 'personal'].forEach(function(scopeName) {
    var group = scopeOf(summary, scopeName);
    if (!group) return;
    html += renderPotCard(group, holdings[scopeName] || 0);
  });

  html += '</div>';
  return html;
}

function renderPotCard(group, stillToAction) {
  var html = '<article class="pot-card">' +
    '<header class="pot-card__header">' +
      '<h3>' + escapeHtml(group.label) + '</h3>' +
      '<div class="pot-card__headline">' +
        '<span class="pot-card__amount">' + formatCurrency(stillToAction) + '</span>' +
        '<span class="muted small">still to action</span>' +
      '</div>' +
    '</header>' +
    '<table class="data-table data-table--compact pot-card__table"><tbody>';

  var byMode = {};
  group.categories.forEach(function(cat) {
    if (!byMode[cat.settle]) byMode[cat.settle] = [];
    byMode[cat.settle].push(cat);
  });

  var rendered = 0;
  settleGroupOrder().forEach(function(mode) {
    var cats = byMode[mode];
    if (!cats || !cats.length) return;
    rendered++;

    var mineOutstanding = 0;
    var mineAllocated = 0;
    cats.forEach(function(c) {
      mineOutstanding += c.outstanding;
      mineAllocated += c.allocated;
    });

    var meta = settleMode(mode);
    html += '<tr class="group-row"><td>' + escapeHtml(meta.groupLabel) + '</td>' +
      '<td class="number">' + formatCurrency(mode === 'auto_paid' ? mineAllocated : mineOutstanding) + '</td>' +
      '<td class="number muted">of ' + formatCurrency(mineAllocated) + '</td></tr>';

    cats.forEach(function(cat) {
      var settledWord = settleMode(cat.settle).settledWord;
      html += '<tr>' +
        '<td>' + escapeHtml(cat.category) + '</td>' +
        '<td class="number">' + formatCurrency(cat.outstanding) + '</td>' +
        '<td class="number muted">' + formatCurrency(cat.paid) + ' ' + escapeHtml(settledWord) + '</td>' +
      '</tr>';
    });
  });

  if (rendered === 0) {
    html += '<tr><td colspan="3" class="muted">Nothing allocated in this range.</td></tr>';
  }

  html += '</tbody></table></article>';
  return html;
}

/**
 * Every outstanding allocation across both pots, in one list. Replaces the
 * per-category tables — the question is "what do I need to do", and that does
 * not divide neatly by category.
 */
function collectItems(summary, wantPaid) {
  var rows = [];
  ((summary && summary.scopes) || []).forEach(function(group) {
    if (group.scope === 'legacy') return;
    group.categories.forEach(function(cat) {
      (cat.items || []).forEach(function(item) {
        var isPaid = item.status === 'paid';
        if (isPaid !== wantPaid) return;
        // Withheld money never arrived, so there is nothing to action.
        if (!wantPaid && cat.settle === 'auto_paid') return;
        rows.push({
          pot: group.label,
          scope: group.scope,
          category: cat.category,
          settle: cat.settle,
          item: item
        });
      });
    });
  });
  return rows;
}

function sortInvoiceIds(a, b) {
  var sa = String(a), sb = String(b);
  var ma = sa.match(/^(\d+)(.*)$/), mb = sb.match(/^(\d+)(.*)$/);
  if (ma && mb) {
    var na = parseInt(ma[1], 10), nb = parseInt(mb[1], 10);
    if (na !== nb) return na - nb;
    return ma[2].localeCompare(mb[2]);
  }
  return sa.localeCompare(sb);
}

function renderActionList(summary) {
  var rows = collectItems(summary, false);
  var total = rows.reduce(function(s, r) { return s + (Number(r.item.amount) || 0); }, 0);

  if (rows.length === 0) {
    return '<section class="flow-group">' +
      '<h3 class="flow-group__title">Needs action</h3>' +
      '<p class="muted">Everything allocated in this range has been actioned.</p>' +
    '</section>';
  }

  rows.sort(function(a, b) {
    if (a.scope !== b.scope) return a.scope === 'business' ? -1 : 1;
    if (a.category !== b.category) return a.category.localeCompare(b.category);
    return sortInvoiceIds(a.item.invoice_id, b.item.invoice_id);
  });

  var html = '<section class="flow-group">' +
    '<h3 class="flow-group__title">Needs action ' +
      '<span class="muted small">' + rows.length + ' items &middot; ' + formatCurrency(total) + '</span></h3>' +
    '<div class="scroll-x"><table class="data-table"><thead><tr>' +
      '<th>Pot</th><th>Category</th><th>Invoice</th><th>Client</th>' +
      '<th class="number">Amount</th><th></th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(row) {
    html += '<tr>' +
      '<td><span class="pot-tag pot-tag--' + escapeHtml(row.scope) + '">' + escapeHtml(row.pot) + '</span></td>' +
      '<td>' + escapeHtml(row.category) + '</td>' +
      '<td><code>' + escapeHtml(row.item.invoice_id) + '</code></td>' +
      '<td>' + escapeHtml(row.item.business_name) + '</td>' +
      '<td class="number">' + formatCurrency(row.item.amount) + '</td>' +
      '<td class="actions"><button type="button" class="btn-small btn-primary" ' +
        'onclick="markAllocationPaid(\'' + jsAttr(row.item.allocation_id) + '\')">' +
        escapeHtml(settleActionLabel(row.settle)) + '</button></td>' +
    '</tr>';
  });

  html += '</tbody></table></div></section>';
  return html;
}

function renderActionedList(summary) {
  var rows = collectItems(summary, true);
  if (rows.length === 0) return '';

  var total = rows.reduce(function(s, r) { return s + (Number(r.item.amount) || 0); }, 0);

  rows.sort(function(a, b) {
    var da = String(a.item.transfer_date || ''), db = String(b.item.transfer_date || '');
    if (da !== db) return db.localeCompare(da);
    return sortInvoiceIds(a.item.invoice_id, b.item.invoice_id);
  });

  var html = '<details class="flow-group"><summary class="flow-group__title">' +
    'Actioned <span class="muted small">' + rows.length + ' items &middot; ' + formatCurrency(total) + '</span>' +
    '</summary>' +
    '<div class="scroll-x"><table class="data-table"><thead><tr>' +
      '<th>Pot</th><th>Category</th><th>Invoice</th><th class="number">Amount</th>' +
      '<th>On</th><th>Note</th><th></th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(row) {
    var isAuto = row.settle === 'auto_paid';
    html += '<tr>' +
      '<td><span class="pot-tag pot-tag--' + escapeHtml(row.scope) + '">' + escapeHtml(row.pot) + '</span></td>' +
      '<td>' + escapeHtml(row.category) +
        (isAuto ? ' <span class="tag tag--auto">at source</span>' : '') + '</td>' +
      '<td><code>' + escapeHtml(row.item.invoice_id) + '</code></td>' +
      '<td class="number">' + formatCurrency(row.item.amount) + '</td>' +
      '<td>' + (row.item.transfer_date ? formatDate(row.item.transfer_date) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (row.item.notes ? escapeHtml(row.item.notes) : '<span class="muted">—</span>') + '</td>' +
      '<td class="actions">' +
        (isAuto ? '' : '<button type="button" class="btn-small btn-subtle" ' +
          'onclick="markAllocationUnpaid(\'' + jsAttr(row.item.allocation_id) + '\')">Undo</button>') +
      '</td>' +
    '</tr>';
  });

  html += '</tbody></table></div></details>';
  return html;
}

/**
 * Pre-company allocations, kept out of the way but not hidden.
 */
function renderLegacySection(summary) {
  var group = scopeOf(summary, 'legacy');
  if (!group || !group.categories.length) return '';

  var holdings = summary.accountHoldings || {};
  var html = '<details class="flow-group"><summary class="flow-group__title">' +
    escapeHtml(group.label) +
    ' <span class="muted small">' + formatCurrency(holdings.legacy || 0) + ' still to action</span>' +
    '</summary>' +
    '<p class="muted small">Allocations made before the business/personal split. Kept for the record.</p>' +
    '<div class="scroll-x"><table class="data-table"><thead><tr>' +
      '<th>Category</th><th>Invoice</th><th class="number">Amount</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>';

  group.categories.forEach(function(cat) {
    cat.items.slice().sort(function(a, b) { return sortInvoiceIds(a.invoice_id, b.invoice_id); })
      .forEach(function(item) {
        var status = item.status || 'allocated';
        html += '<tr>' +
          '<td>' + escapeHtml(cat.category) + '</td>' +
          '<td><code>' + escapeHtml(item.invoice_id) + '</code></td>' +
          '<td class="number">' + formatCurrency(item.amount) + '</td>' +
          '<td><span class="badge badge-' + escapeHtml(status) + '">' + escapeHtml(status) + '</span></td>' +
          '<td class="actions">' +
            (cat.isWithheld ? '' : (status === 'allocated'
              ? '<button type="button" class="btn-small btn-subtle" onclick="markAllocationPaid(\'' +
                jsAttr(item.allocation_id) + '\')">Mark Paid</button>'
              : '<button type="button" class="btn-small btn-subtle" onclick="markAllocationUnpaid(\'' +
                jsAttr(item.allocation_id) + '\')">Undo</button>')) +
          '</td>' +
        '</tr>';
      });
  });

  html += '</tbody></table></div></details>';
  return html;
}

function markAllocationPaid(allocationId) {
  var note = prompt('Where did this go? (optional)');
  if (note === null) return;
  var params = allocationId + '|paid|' + todayStr() + '|' + (note || '');
  serverCall('updateAllocationStatusFromClient', params).then(function() {
    showToast('Marked as actioned');
    renderBudgetSummary();
  }).catch(function(err) { showToast(err.message, 'error'); });
}

function markAllocationUnpaid(allocationId) {
  serverCall('updateAllocationStatusFromClient', allocationId + '|allocated|').then(function() {
    showToast('Reverted to allocated');
    renderBudgetSummary();
  }).catch(function(err) { showToast(err.message, 'error'); });
}

// --- Allocate Invoice ---

function renderBudgetAllocate() {
  var content = document.getElementById('budget-tab-content');
  content.innerHTML = '<div aria-busy="true">Loading invoices...</div>';

  // Its own date range: AppState.dateFrom/dateTo is a global that every other
  // page overwrites, so visiting Hours first used to shrink this to two days
  // and report "nothing to allocate" — with no date control here to see why.
  var range = datePreset('ytd');

  Promise.all([
    serverCall('getInvoicesWithDetails', { dateFrom: range.from, dateTo: range.to }),
    serverCall('getAllClient', 'BudgetAllocations'),
    serverCall('getBudgetRules')
  ]).then(function(results) {
    var invoices = results[0] || [];
    var existingAllocs = results[1] || [];
    var rules = (results[2] || []).filter(function(r) {
      return isFlagTrue(r.active) || r.active === '' || r.active === undefined || r.active === null;
    });

    // normalizeId on both sides: Sheets stores invoice_id '0526' on the
    // allocation row as the number 526, so a raw key never matched and an
    // allocated invoice stayed in this list forever.
    var allocatedInvoiceIds = {};
    existingAllocs.forEach(function(a) { allocatedInvoiceIds[normalizeId(a.invoice_id)] = true; });

    var eligible = invoices.filter(function(inv) {
      return inv.status === 'paid' && !allocatedInvoiceIds[normalizeId(inv.invoice_id)];
    });

    if (eligible.length === 0) {
      content.innerHTML =
        '<article class="empty-state">' +
          '<h3>Nothing to allocate</h3>' +
          '<p class="muted">Every paid invoice created between ' + escapeHtml(range.from) + ' and ' +
            escapeHtml(range.to) + ' is already allocated. Mark a new invoice as paid in the Invoices tab to allocate it here.</p>' +
        '</article>';
      return;
    }

    if (rules.length === 0) {
      content.innerHTML =
        '<article class="empty-state">' +
          '<h3>No budget rules yet</h3>' +
          '<p class="muted">Add a budget rule under Settings &rarr; Budget Rules before allocating.</p>' +
        '</article>';
      return;
    }

    var defaultRule = rules.find(function(r) { return isFlagTrue(r.is_default); }) || rules[0];

    var invoiceOptions = eligible.map(function(inv) {
      return {
        id: inv.invoice_id,
        label: inv.invoice_id + ' — ' + inv.business_name + ' (' + formatCurrency(inv.total, inv.currency) + ')'
      };
    });

    // Flag pre-company rules so an old cascade is never applied by accident.
    var ruleOptions = rules.map(function(r) {
      return {
        id: r.rule_id,
        label: r.name + (ruleModelOf(r) === 'company' ? '' : ' (sole trader)')
      };
    });

    content.innerHTML =
      '<form id="allocate-form" class="form-card">' +
        '<div class="form-row">' +
          '<label>Invoice ' + buildSelect('ba-invoice', invoiceOptions, 'id', 'label', { required: true }) + '</label>' +
          '<label>Budget rule ' + buildSelect('ba-rule', ruleOptions, 'id', 'label', { required: true, selected: defaultRule.rule_id, placeholder: false }) + '</label>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button type="button" onclick="previewAllocation()">Preview allocation</button>' +
        '</div>' +
      '</form>' +
      '<div id="allocation-preview"></div>';
  }).catch(function(err) {
    content.innerHTML = '<p class="error">Error: ' + escapeHtml(err.message) + '</p>';
  });
}

/**
 * Cascade rows for the preview, built from the stage figures the server
 * returned. Company and sole-trader rules report different stages.
 */
function cascadeRows(model, s, currency) {
  var rows = [];
  var add = function(label, value, opts) {
    opts = opts || {};
    if (opts.onlyIfNonZero && !value) return;
    rows.push({ label: label, value: value, negative: !!opts.negative, strong: !!opts.strong });
  };

  add('Gross (billed hours)', s.gross);
  add('Less withheld at source', s.withheld, { negative: true, onlyIfNonZero: true });

  if (model === 'company') {
    add('Business income', s.businessIncome, { strong: true });
    add('Less business allocations (tax, ACC, reserve)', s.businessObligations, { negative: true, onlyIfNonZero: true });
    add('Owner Pay — drawn to personal', s.ownerPay, { strong: true });
    add('Less personal tax & ACC', s.personalObligations, { negative: true, onlyIfNonZero: true });
    add('Personal net to distribute', s.personalNet, { strong: true });
  } else {
    add('Adjusted', s.adjusted, { strong: true });
    add('Less obligations (tax/ACC to pay)', s.obligations, { negative: true, onlyIfNonZero: true });
    add('Net to distribute', s.net, { strong: true });
  }

  add('Plus GST collected (held for IRD)', s.gst, { onlyIfNonZero: true });

  return rows.map(function(r) {
    return '<div' + (r.strong ? ' class="preview-numbers__key"' : '') + '>' +
      '<span class="muted">' + escapeHtml(r.label) + '</span>' +
      '<strong>' + (r.negative ? '&minus;' : '') + formatCurrency(r.value, currency) + '</strong>' +
    '</div>';
  }).join('');
}

function previewAllocation() {
  var invoiceId = document.getElementById('ba-invoice').value;
  var ruleId = document.getElementById('ba-rule').value;

  if (!invoiceId || !ruleId) {
    showToast('Pick an invoice and a rule.', 'error');
    return;
  }

  var preview = document.getElementById('allocation-preview');
  preview.innerHTML = '<div aria-busy="true">Calculating...</div>';

  // The server computes this with the same code that writes the allocations,
  // so a preview can never disagree with the result.
  serverCall('previewAllocationFromClient', invoiceId + '|' + ruleId).then(function(data) {
    var currency = data.currency || 'NZD';
    var lines = data.lines || [];
    var isCompany = data.model === 'company';
    var stages = data.stages || {};

    var explainer = isCompany
      ? 'Allocated from billed hours only — expenses are pass-throughs. ' +
        'Business tax, ACC and reserve come off business income; what is left is Owner Pay, ' +
        'drawn to your personal account. Personal tax and ACC come off Owner Pay, and ' +
        'Donate/Save/Invest/Spend split what remains. GST is held for the IRD and sits outside the split.'
      : 'Pre-company rule: withheld comes off gross to give adjusted, tax/ACC to pay come off ' +
        'adjusted to give net, and Donate/Save/Invest/Spend split the net.';

    var html =
      '<article class="preview-card">' +
        '<header>' +
          '<h3>Preview</h3>' +
          '<p class="muted">' + escapeHtml(data.invoice_id) + ' · ' + escapeHtml(data.business_name || '') +
            ' · Rule: <strong>' + escapeHtml(data.rule.name) + '</strong>' +
            (isCompany ? '' : ' <span class="tag">sole trader</span>') + '</p>' +
        '</header>' +
        '<div class="preview-numbers">' + cascadeRows(data.model, stages, currency) + '</div>' +
        '<p class="muted" style="font-size:0.78rem;margin:0 0 0.5rem;">' + explainer + '</p>' +
        '<div class="scroll-x"><table class="data-table">' +
          '<thead><tr><th>Pot</th><th>Category</th><th class="number">%</th><th class="number">Amount</th><th>From</th></tr></thead><tbody>';

    var basisNote = {
      gross: 'Gross',
      invoice_gst: 'Invoice GST',
      business_income: 'Business income',
      remainder: 'Remainder after business allocations',
      owner_pay: 'Owner Pay',
      personal_net: 'Personal net',
      adjusted: 'Adjusted',
      net: 'Net'
    };

    var lastScope = null;
    lines.forEach(function(line) {
      if (line.scope !== lastScope) {
        lastScope = line.scope;
        html += '<tr class="group-row"><td colspan="5">' + escapeHtml(allocationScopeLabel(line.scope)) + '</td></tr>';
      }
      html += '<tr>' +
        '<td><span class="pot-tag pot-tag--' + escapeHtml(line.scope) + '">' + escapeHtml(allocationScopeLabel(line.scope)) + '</span></td>' +
        '<td>' + escapeHtml(line.label) +
          (line.settle === 'auto_paid' ? ' <span class="tag tag--auto">at source</span>' : '') +
          (line.isTransfer ? ' <span class="tag">transfer</span>' : '') + '</td>' +
        '<td class="number">' + (line.pct == null ? '—' : formatPercent(line.pct)) + '</td>' +
        '<td class="number">' + formatCurrency(line.amount, currency) + '</td>' +
        '<td class="muted">' + escapeHtml(basisNote[line.basis] || '') + '</td>' +
      '</tr>';
    });

    // Expenses are billed but never allocated, so the allocation total only
    // matches the invoice total when there are none. Say which it is rather
    // than claiming they always agree.
    var allocatedBase = (Number(stages.gross) || 0) + (Number(stages.gst) || 0);
    html += '<tr class="total-row"><td colspan="2"><strong>Total (excl. Owner Pay transfer)</strong></td><td></td>' +
      '<td class="number"><strong>' + formatCurrency(data.total, currency) + '</strong></td>' +
      '<td class="muted">billed hours + GST</td></tr>';
    html += '</tbody></table></div>' +
      '<p class="muted small" style="margin:0.4rem 0 0.5rem;">' +
        'Allocating ' + formatCurrency(allocatedBase, currency) + ' of billed hours and GST. ' +
        'Any expenses on this invoice are reimbursements and are deliberately left out.' +
      '</p>' +
      '<div class="form-actions">' +
        '<button type="button" class="btn-primary" onclick="confirmAllocation()">Confirm allocation</button>' +
        '<button type="button" class="btn-subtle" onclick="document.getElementById(\'allocation-preview\').innerHTML=\'\'">Cancel</button>' +
      '</div>' +
    '</article>';

    preview.innerHTML = html;
  }).catch(function(err) {
    preview.innerHTML = '<p class="error">Error: ' + escapeHtml(err.message) + '</p>';
  });
}

function confirmAllocation() {
  var invoiceId = document.getElementById('ba-invoice').value;
  var ruleId = document.getElementById('ba-rule').value;

  serverCall('allocateBudgetFromClient', invoiceId + '|' + ruleId).then(function() {
    showToast('Budget allocated');
    App.invalidate(['budget', 'dashboard']);
    showBudgetTab('summary');
  }).catch(function(err) {
    showToast(err.message, 'error');
  });
}
</script>
