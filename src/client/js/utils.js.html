<script>
/**
 * Shared utility functions for the frontend.
 */

var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Persist filter state across page invalidations
var AppState = {
  year: new Date().getFullYear().toString(),
  dateFrom: new Date().getFullYear() + '-01-01',
  dateTo: new Date().getFullYear() + '-12-31',
  hoursBiz: ''
};

// Cache for reference data
var AppCache = {
  businesses: null,
  workCodes: null,
  accounts: null,
  budgetRules: null,
  budgetCategories: null,
  contracts: null,
  myDetails: null,

  clear: function() {
    this.businesses = null;
    this.workCodes = null;
    this.accounts = null;
    this.budgetRules = null;
    this.budgetCategories = null;
    this.contracts = null;
    this.myDetails = null;
  }
};

/**
 * Budget category definitions, served by the registry in BudgetCategories.gs.
 * The front end keeps no list of its own — every ordering, label and
 * percentage field comes from here.
 */
function budgetCategoryDefs() {
  var reg = AppCache.budgetCategories;
  return (reg && reg.categories) || [];
}

function budgetCategoryDefsInGroup(group) {
  return budgetCategoryDefs().filter(function(d) { return d.group === group; });
}

/**
 * Settlement mode metadata, from the server registry. Falls back to sensible
 * wording if the registry has not loaded.
 */
function settleMode(settle) {
  var reg = AppCache.budgetCategories;
  var modes = (reg && reg.settleModes) || {};
  return modes[settle] || { key: settle, groupLabel: 'Other', verb: 'Mark Paid', settledWord: 'moved' };
}

/**
 * The verb on a Money Flow action button, and the same act as a noun.
 *
 * Every button says "Pay", whatever the bucket's settle mode. Pay / Set aside
 * / Transfer described the same act — money leaving the account it is sitting
 * in — in three words, which made the page read as three mechanisms when
 * there is only one. The settle mode still decides whether a bucket HAS a
 * button (withheld money does not) and still drives the wording where it is
 * describing what happened rather than offering an action.
 */
function settleShortVerb(settle) {
  return settle === 'auto_paid' ? '' : 'Pay';
}

function settleNoun(settle) {
  return settle === 'auto_paid' ? '' : 'payment';
}

function settleActionLabel(settle) {
  return settleMode(settle).verb || 'Mark Paid';
}

function settleGroupOrder() {
  var reg = AppCache.budgetCategories;
  return (reg && reg.settleGroupOrder) || ['pay', 'hold', 'transfer', 'auto_paid'];
}

/**
 * Human label for an allocation scope ('business' -> 'Business').
 */
function allocationScopeLabel(scope) {
  var reg = AppCache.budgetCategories;
  var scopes = (reg && reg.scopes) || [];
  var found = scopes.find(function(s) { return s.scope === scope; });
  return found ? found.label : scope;
}

/**
 * How the registry's buckets are grouped for display. Shared by the Budget page
 * and the Dashboard so the two cannot drift — and declared here, in the first
 * file the page includes, rather than in one screen's module: dashboard.js is
 * included BEFORE budget.js, so a grouping owned by budget.js would be a
 * load-order accident waiting to break.
 *
 * `keys` are registry category keys; where a company bucket has a sole-trader
 * counterpart both are listed so they merge into one figure, and `legacyKeys`
 * names the sole-trader part so the UI can call it out.
 */
var BIZ_OBLIGATIONS = [
  { label: 'Tax to pay', keys: ['biz_tax'] },
  // GST registration began with the company, so there is no sole-trader GST —
  // but fold legacy_gst in rather than silently dropping a row that does exist.
  { label: 'GST to pay', keys: ['biz_gst', 'legacy_gst'], legacyKeys: ['legacy_gst'] },
  { label: 'ACC to pay', keys: ['biz_acc'] }
];

var PERSONAL_OBLIGATIONS = [
  { label: 'Tax to pay', keys: ['per_tax', 'legacy_tax'], legacyKeys: ['legacy_tax'] },
  { label: 'ACC to pay', keys: ['per_acc', 'legacy_acc'], legacyKeys: ['legacy_acc'] }
];

// Displayed in this order, each merging its company and sole-trader bucket.
var PERSONAL_ALLOCATIONS = [
  { label: 'Save', settle: 'hold', keys: ['per_save', 'legacy_save'] },
  { label: 'Donate', settle: 'pay', keys: ['per_donate', 'legacy_donate'] },
  { label: 'Invest', settle: 'hold', keys: ['per_invest', 'legacy_invest'] },
  { label: 'Spend', settle: 'transfer', keys: ['per_spend', 'legacy_spend'] }
];

var WITHHELD_KEYS = ['legacy_tax_withheld', 'legacy_acc_withheld', 'biz_tax_withheld', 'biz_acc_withheld'];

/**
 * Sheets hands booleans back as true, 'TRUE' or 'true' depending on how the
 * cell was written.
 */
function isFlagTrue(val) {
  return val === true || val === 'TRUE' || val === 'true';
}

/**
 * Which cascade a rule's percentages belong to. Mirrors ruleModel() in
 * BudgetCategories.gs: a stored model wins, otherwise a rule is only sole
 * trader if it actually has legacy percentages. A rule with neither was written
 * by the company form before the `model` column existed, and treating it as
 * legacy would strand it in a table where it cannot be repaired.
 */
function ruleModelOf(rule) {
  var stored = String((rule && rule.model) || '');
  if (stored === 'company') return 'company';
  if (stored === 'sole_trader') return 'sole_trader';

  var reg = AppCache.budgetCategories;
  var legacyDefs = (reg && reg.legacy) || [];
  var hasLegacyPct = legacyDefs.some(function(d) {
    return d.pctField && (Number(rule[d.pctField]) || 0) !== 0;
  });
  return hasLegacyPct ? 'sole_trader' : 'company';
}

/**
 * Escape a value for use inside a single-quoted JS string in an HTML attribute,
 * e.g. onclick="doThing('...')".
 *
 * escapeHtml is NOT enough here: it turns ' into &#39;, the HTML parser decodes
 * that back to ' before the JS is parsed, and the string still breaks. A work
 * code like "Bob's Dev" silently killed the button it was rendered into.
 */
function jsAttr(value) {
  return String(value == null ? '' : value)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/</g, '\\x3C')
    .replace(/\r?\n/g, '\\n');
}

/**
 * Promise wrapper around google.script.run with a timeout.
 */
function serverCall(functionName, args) {
  var TIMEOUT_MS = 45000;

  return new Promise(function(resolve, reject) {
    var settled = false;
    var timer = setTimeout(function() {
      if (!settled) {
        settled = true;
        console.error('[serverCall] TIMEOUT: ' + functionName);
        reject(new Error('Server call "' + functionName + '" timed out after ' + (TIMEOUT_MS / 1000) + 's'));
      }
    }, TIMEOUT_MS);

    var runner = google.script.run
      .withSuccessHandler(function(result) {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          resolve(result);
        }
      })
      .withFailureHandler(function(err) {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          console.error('[serverCall] FAIL: ' + functionName, err);
          reject(new Error(err.message || err));
        }
      });

    if (args !== undefined) {
      runner[functionName](args);
    } else {
      runner[functionName]();
    }
  });
}

/**
 * Show a toast notification.
 */
function showToast(message, type) {
  type = type || 'success';
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

/**
 * Format a number as currency with the correct currency code.
 */
function formatCurrency(amount, currency) {
  currency = currency || 'NZD';
  try {
    return new Intl.NumberFormat('en-NZ', {
      style: 'currency',
      currency: currency
    }).format(amount || 0);
  } catch (e) {
    return currency + ' ' + (Number(amount) || 0).toFixed(2);
  }
}

/**
 * Format a date as "dd Mon yy" (e.g. "12 Apr 26").
 * Accepts Date objects, ISO strings, or "YYYY-MM-DD" strings.
 */
function parseLocalDate(dateStr) {
  if (dateStr instanceof Date) return dateStr;
  var s = String(dateStr);
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
  return new Date(dateStr);
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  var d = parseLocalDate(dateStr);
  if (isNaN(d.getTime())) return String(dateStr);
  var day = String(d.getDate()).padStart(2, '0');
  var mon = MONTHS_SHORT[d.getMonth()];
  var yr = String(d.getFullYear()).slice(-2);
  return day + ' ' + mon + ' ' + yr;
}

/**
 * Format a month as "Mon yy" (e.g. "Apr 26"). Accepts "YYYY-MM" or ISO strings.
 */
function formatMonth(monthStr) {
  if (!monthStr) return '';
  var str = String(monthStr);
  var m = str.match(/^(\d{4})-(\d{1,2})/);
  if (m) {
    var yr = m[1].slice(-2);
    var mon = MONTHS_SHORT[parseInt(m[2], 10) - 1];
    return mon + ' ' + yr;
  }
  var d = parseLocalDate(str);
  if (!isNaN(d.getTime())) {
    return MONTHS_SHORT[d.getMonth()] + ' ' + String(d.getFullYear()).slice(-2);
  }
  return str;
}

/**
 * Extract YYYY-MM from a month value (handles ISO strings).
 */
function normalizeMonth(val) {
  if (!val) return '';
  var str = String(val);
  var m = str.match(/^(\d{4})-(\d{1,2})/);
  if (m) {
    var mm = parseInt(m[2], 10);
    return m[1] + '-' + (mm < 10 ? '0' + mm : '' + mm);
  }
  return str;
}

/**
 * Format a number as a percentage.
 */
function formatPercent(value) {
  // A blank cell is "not set", not zero — and Number(undefined) is NaN, which
  // used to render as "NaN%".
  if (value === '' || value === null || value === undefined) return '—';
  var num = Number(value);
  if (isNaN(num)) return '—';
  return (num * 100).toFixed(1) + '%';
}

/**
 * Generate an HTML <select> from an array of items.
 */
function buildSelect(id, items, valueField, labelField, options) {
  options = options || {};
  var html = '<select id="' + id + '" name="' + id + '"' +
             (options.required ? ' required' : '') + '>';
  if (options.placeholder !== false) {
    html += '<option value="">' + (options.placeholder || 'Select...') + '</option>';
  }
  items.forEach(function(item) {
    var selected = options.selected === item[valueField] ? ' selected' : '';
    html += '<option value="' + escapeHtml(item[valueField]) + '"' + selected + '>' +
            escapeHtml(item[labelField]) + '</option>';
  });
  html += '</select>';
  return html;
}

/**
 * Escape HTML entities.
 */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function idsMatch(a, b) {
  var sa = String(a);
  var sb = String(b);
  if (sa === sb) return true;
  return sa.replace(/^0+/, '') === sb.replace(/^0+/, '') && (sa !== '' && sb !== '');
}

function normalizeId(id) {
  // Matches normalizeId in SheetService.gs — these are used on opposite sides
  // of the same lookups, so they must agree.
  var s = String(id == null ? '' : id);
  return s.replace(/^0+/, '') || '0';
}

/**
 * Warn when the spreadsheet is missing columns the code expects.
 *
 * Until setupSheets() is run after a schema change, writes lose any field whose
 * column does not exist — which is how a set of budget percentages once
 * vanished without an error. Better to say so up front.
 */
function renderSchemaWarning(warnings, errors) {
  var host = document.getElementById('schema-warning');
  if (!host) return;

  var parts = [];
  if (warnings && warnings.length) {
    parts.push('<strong>Your spreadsheet is missing columns.</strong> ' +
      'Open the spreadsheet and choose <em>Finance Tracker &rarr; Run setup / migrations</em> ' +
      '(or run <code>setupSheets()</code> in the Apps Script editor). Until then, saving may ' +
      'silently lose data.<br><span class="small">' +
      warnings.map(function(w) {
        return escapeHtml(w.sheet) + ': ' + escapeHtml((w.missing || []).join(', '));
      }).join('<br>') + '</span>');
  }
  if (errors && errors.length) {
    parts.push('<strong>Some data could not be loaded.</strong><br><span class="small">' +
      errors.map(escapeHtml).join('<br>') + '</span>');
  }

  if (parts.length === 0) {
    host.innerHTML = '';
    host.hidden = true;
    return;
  }

  host.hidden = false;
  host.innerHTML = '<div class="app-banner app-banner--warn">' +
    '<div>' + parts.join('<hr>') + '</div>' +
    '<button type="button" class="btn-small btn-subtle" ' +
      'onclick="this.closest(\'#schema-warning\').hidden = true;">Dismiss</button>' +
  '</div>';
}

/**
 * Load all reference data via a single bootstrap RPC.
 * Massive speedup over 5 separate calls.
 */
function loadReferenceData() {
  return serverCall('bootstrap').then(function(data) {
    AppCache.businesses = data.businesses || [];
    AppCache.workCodes = data.workCodes || [];
    AppCache.accounts = data.accounts || [];
    AppCache.budgetRules = data.budgetRules || [];
    AppCache.budgetCategories = data.budgetCategories || null;
    AppCache.contracts = data.contracts || [];
    AppCache.myDetails = data.myDetails || {};
    renderSchemaWarning(data.schemaWarnings, data.errors);
  }).catch(function(err) {
    console.warn('[bootstrap] Failed, falling back to empty cache:', err.message);
    AppCache.businesses = AppCache.businesses || [];
    AppCache.workCodes = AppCache.workCodes || [];
    AppCache.accounts = AppCache.accounts || [];
    AppCache.budgetRules = AppCache.budgetRules || [];
    AppCache.budgetCategories = AppCache.budgetCategories || null;
    AppCache.contracts = AppCache.contracts || [];
    AppCache.myDetails = AppCache.myDetails || {};
    throw err;
  });
}

/**
 * Refresh the reference data cache AND invalidate every page cache
 * so dependent UIs pick up the change on next navigation.
 * Call after mutating businesses, work codes, accounts, or budget rules.
 */
function refreshReferenceData() {
  return loadReferenceData().then(function() {
    if (typeof App !== 'undefined' && App.invalidate) {
      App.invalidate(['dashboard', 'hours', 'invoices', 'budget', 'accounts', 'settings']);
    }
  });
}

/**
 * Get today's date as YYYY-MM-DD.
 */
function todayStr() {
  var d = new Date();
  var mo = String(d.getMonth() + 1).padStart(2, '0');
  var da = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + mo + '-' + da;
}

/**
 * Get current month as YYYY-MM.
 */
function currentMonth() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

/**
 * Look up the currency for a business by ID.
 */
function getCurrencyForBusiness(businessId) {
  if (!AppCache.businesses) return 'NZD';
  var biz = AppCache.businesses.find(function(b) { return idsMatch(b.business_id, businessId); });
  return (biz && biz.currency) || 'NZD';
}

/**
 * Build a work code select that shows "CODE - Description".
 */
function buildCodeSelect(id, codes, options) {
  options = options || {};
  var items = (codes || []).map(function(c) {
    return { value: c.code_id, label: c.code_id + ' - ' + c.description };
  });
  return buildSelect(id, items, 'value', 'label', options);
}

/**
 * Build a year selector input.
 */
function buildYearSelect(id, selectedYear) {
  selectedYear = selectedYear || AppState.year;
  return '<input type="number" id="' + id + '" value="' + selectedYear + '" min="2020" max="2099" style="width:6rem;">';
}

/**
 * Get first day of year as YYYY-MM-DD.
 */
function yearStart(year) {
  return year + '-01-01';
}

/**
 * Get last day of year as YYYY-MM-DD.
 */
function yearEnd(year) {
  return year + '-12-31';
}

function datePreset(type) {
  var now = new Date();
  var y = now.getFullYear();
  var to = todayStr();
  switch (type) {
    case 'yesterday':
      var yd = new Date(now); yd.setDate(yd.getDate() - 1);
      return { from: fmtDate(yd), to: to };
    case 'week':
      var w = new Date(now); w.setDate(w.getDate() - 6);
      return { from: fmtDate(w), to: to };
    case 'month':
      return { from: y + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-01', to: to };
    case '3months':
      var m3 = new Date(now); m3.setMonth(m3.getMonth() - 3);
      return { from: fmtDate(m3), to: to };
    case '6months':
      var m6 = new Date(now); m6.setMonth(m6.getMonth() - 6);
      return { from: fmtDate(m6), to: to };
    case 'lastMonth':
      // Full previous calendar month — the usual invoicing period.
      return {
        from: fmtDate(new Date(y, now.getMonth() - 1, 1)),
        to: fmtDate(new Date(y, now.getMonth(), 0))
      };
    case 'ytd':
      return { from: y + '-01-01', to: to };
    default:
      return { from: y + '-01-01', to: y + '-12-31' };
  }
}

function fmtDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function buildDateFilters(fromId, toId, fromVal, toVal) {
  return '<label>From <input type="date" id="' + fromId + '" value="' + (fromVal || AppState.dateFrom) + '"></label>' +
    '<label>To <input type="date" id="' + toId + '" value="' + (toVal || AppState.dateTo) + '"></label>';
}

function buildPresetPills(containerId, presets, activeName) {
  return '<div class="period-pills" id="' + containerId + '">' +
    presets.map(function(p) {
      return '<button type="button" class="period-pill' + (p.id === activeName ? ' active' : '') +
        '" data-preset="' + p.id + '">' + p.label + '</button>';
    }).join('') + '</div>';
}

/**
 * Format a time value for display. Handles HH:MM strings, ISO datetimes, and Date objects.
 */
function formatTime(val) {
  if (!val) return '';
  var str = String(val).trim();
  if (/^\d{1,2}:\d{2}$/.test(str)) {
    return str.length === 4 ? '0' + str : str;
  }
  var m = str.match(/T(\d{2}:\d{2})/);
  if (m) return m[1];
  var ampm = str.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)$/i);
  if (ampm) {
    var h = parseInt(ampm[1], 10);
    var min = ampm[2];
    var period = ampm[3].toUpperCase();
    if (period === 'AM' && h === 12) h = 0;
    else if (period === 'PM' && h !== 12) h += 12;
    return String(h).padStart(2, '0') + ':' + min;
  }
  var hms = str.match(/^(\d{1,2}):(\d{2}):\d{2}$/);
  if (hms) return hms[1].padStart(2, '0') + ':' + hms[2];
  if (val instanceof Date && !isNaN(val.getTime())) {
    return String(val.getHours()).padStart(2, '0') + ':' + String(val.getMinutes()).padStart(2, '0');
  }
  return str;
}

/**
 * Add hours to a time string (HH:MM), returns HH:MM.
 */
function addHoursToTime(timeStr, hours) {
  var parts = timeStr.split(':');
  var h = parseInt(parts[0], 10) + hours;
  var m = parseInt(parts[1] || '0', 10);
  if (h >= 24) h = 23;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
</script>
